name: Daily npm audit fix

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-cron
  cancel-in-progress: true

jobs:
  audit-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Apply audit fixes
        run: npm audit fix
      - name: Run lint
        run: npm run lint
      - name: Run audit
        run: npm run audit
      # Mirrors resolveBuildBasePath() in src/utils/paths.ts — keep in sync
      - name: Resolve base path
        run: |
          if [ -f CNAME ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "Custom domain detected: $(cat CNAME) → base path /"
          else
            REPO="${GITHUB_REPOSITORY#*/}"
            echo "VITE_BASE_PATH=/${REPO}/" >> "$GITHUB_ENV"
            echo "Project Pages → base path /${REPO}/"
          fi
      - name: Run build
        run: npm run build
      - name: Run tests
        run: npm run test:all
      - name: Commit dependency updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "deps: apply npm audit fix"
            git push
          fi

name: Build and deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "assets/coverage-badge.svg"

  # Run workflow manually from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  #
  # Setup, install dependencies, lint, audit, build, run test coverage, and upload artifacts
  #
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: nix develop --command npm ci
        shell: bash
      - name: Run lint
        run: nix develop --command npm run lint
      - name: Run audit
        run: nix develop --command npm run audit
      - name: Run build
        run: nix develop --command npm run build
      - name: Run test coverage
        run: nix develop --command npm run coverage
      - name: Generate coverage badge
        run: nix develop --command npm run generate-coverage-badge
      - name: Commit coverage badge
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/coverage-badge.svg
          if ! git diff --staged --quiet; then
            git commit -m "Update coverage badge"
            git push
          fi
      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  #
  # Deploy to GitHub Pages
  #
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
